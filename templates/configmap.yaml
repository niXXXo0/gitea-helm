apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gitea-helm.fullname" . }}-config
  labels:
    {{- include "gitea-helm.labels" . | nindent 4 }}
data:
  GITEA__database__DB_TYPE: "postgres"
  GITEA__database__HOST: "postgres:{{ .Values.postgres.service.port }}"
  GITEA__database__NAME: {{ .Values.postgres.database | quote }}
  GITEA__database__USER: {{ .Values.postgres.username | quote }}

  GITEA__server__HTTP_PORT: {{ .Values.gitea.service.httpPort | quote }}
  GITEA__server__ROOT_URL: "http://{{ .Values.ingress.host }}/"
  GITEA__server__DOMAIN: {{ .Values.ingress.host | quote }}
  GITEA__server__SSH_DOMAIN: {{ .Values.ingress.host | quote }}
  GITEA__server__SSH_PORT: {{ .Values.gitea.service.sshPort | quote }}

  GITEA__security__INSTALL_LOCK: "true"

  # Обязательно для replicaCount > 1 на общем PVC: иначе второй экземпляр
  # падает на эксклюзивной блокировке LevelDB-очередей (см. README).
  GITEA__queue__TYPE: "channel"
  GITEA__indexer__ISSUE_INDEXER_TYPE: "db"
  GITEA__session__PROVIDER: "db"
