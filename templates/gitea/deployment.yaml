
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea
  labels:
    app.kubernetes.io/name: gitea
    app.kubernetes.io/instance: {{ .Release.Name }}

spec:
  replicas: {{ .Values.gitea.replicaCount }}

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app.kubernetes.io/name: gitea
      app.kubernetes.io/instance: {{ .Release.Name }}

  template:
    metadata:
      labels:
        app.kubernetes.io/name: gitea
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}

    spec:
      automountServiceAccountToken: false

      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

      initContainers:
        - name: init-gitea-permissions
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              mkdir -p /mnt/gitea/data /mnt/gitea/config
              chown -R 1000:1000 /mnt/gitea/data /mnt/gitea/config

          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER

          volumeMounts:
            - name: gitea-data
              mountPath: /mnt/gitea

      containers:
        - name: gitea
          image: "{{ .Values.gitea.image.repository }}:{{ .Values.gitea.image.tag }}"
          imagePullPolicy: {{ .Values.gitea.image.pullPolicy }}

          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          ports:
            - name: http
              containerPort: {{ .Values.gitea.service.httpPort }}
              protocol: TCP

            - name: ssh
              containerPort: {{ .Values.gitea.service.sshPort }}
              protocol: TCP

          env:
            - name: GITEA__database__PASSWD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.existingSecret | default (printf "%s-postgres" (include "gitea-helm.fullname" .)) }}
                  key: {{ .Values.postgres.secretKeys.postgresPassword }}

          envFrom:
            - configMapRef:
                name: {{ include "gitea-helm.fullname" . }}-config

          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: {{ .Values.gitea.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.gitea.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.gitea.probes.startup.failureThreshold }}

          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: {{ .Values.gitea.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.gitea.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.gitea.probes.liveness.failureThreshold }}

          readinessProbe:
            httpGet:
              path: /api/healthz
              port: http
            periodSeconds: {{ .Values.gitea.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.gitea.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.gitea.probes.readiness.failureThreshold }}

          resources:
            {{- toYaml .Values.gitea.resources | nindent 12 }}

          volumeMounts:
            - name: gitea-data
              mountPath: /var/lib/gitea
              subPath: data

            - name: gitea-data
              mountPath: /etc/gitea
              subPath: config

      volumes:
        - name: gitea-data
          persistentVolumeClaim:
            claimName: {{ include "gitea-helm.fullname" . }}-gitea
