
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "gitea-helm.fullname" . }}-gitea
  labels:
    {{- include "gitea-helm.labels" . | nindent 4 }}
spec:
  accessModes:
    {{- toYaml .Values.gitea.persistence.accessModes | nindent 4 }}

  {{- with .Values.gitea.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}

  resources:
    requests:
      storage: {{ .Values.gitea.persistence.size }}
