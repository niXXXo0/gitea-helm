
apiVersion: v1
kind: Service
metadata:
  name: gitea
  labels:
    {{- include "gitea-helm.labels" . | nindent 4 }}
spec:
  type: {{ .Values.gitea.service.type }}
  ports:
    - name: http
      port: {{ .Values.gitea.service.httpPort }}
      targetPort: http
      protocol: TCP

    - name: ssh
      port: {{ .Values.gitea.service.sshPort }}
      targetPort: ssh
      protocol: TCP

  selector:
    app.kubernetes.io/name: gitea
    app.kubernetes.io/instance: {{ .Release.Name }}
