
{{- if .Values.backup.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "gitea-helm.fullname" . }}-backup
  labels:
    {{- include "gitea-helm.labels" . | nindent 4 }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "gitea-helm.fullname" . }}-backup
  labels:
    {{- include "gitea-helm.labels" . | nindent 4 }}
rules:
  # Read and watch the Gitea Deployment
  - apiGroups:
      - apps
    resources:
      - deployments
    resourceNames:
      - gitea
    verbs:
      - get
      - list
      - watch

  # Scale the Gitea Deployment
  - apiGroups:
      - apps
    resources:
      - deployments/scale
    resourceNames:
      - gitea
    verbs:
      - get
      - patch
      - update

  # Monitor Pods in the release namespace
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "gitea-helm.fullname" . }}-backup
  labels:
    {{- include "gitea-helm.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "gitea-helm.fullname" . }}-backup
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "gitea-helm.fullname" . }}-backup
{{- end }}
