
{{- if not .Values.postgres.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gitea-helm.fullname" . }}-postgres
  labels:
    {{- include "gitea-helm.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.postgres.secretKeys.postgresPassword }}: {{ required "postgres.password is required when existingSecret is empty" .Values.postgres.password | quote }}
{{- end }}
